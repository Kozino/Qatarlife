services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: qatar_life
      POSTGRES_USER: qatar_life
      POSTGRES_PASSWORD: qatar_life_dev_only
    ports:
      - "5432:5432"
    volumes:
      - qatar-life-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qatar_life -d qatar_life"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  qatar-life-postgres:
