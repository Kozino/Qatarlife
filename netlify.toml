[build]
  command = "npm ci --include=dev && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routing for the browser/PWA shell. API and WebSocket traffic use
# the absolute Render URL configured in VITE_API_BASE_URL and VITE_WS_URL.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
